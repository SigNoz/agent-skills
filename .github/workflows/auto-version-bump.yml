name: Auto CalVer Bump

# Runs on push to main, then opens or updates a PR with CalVer bumps for every
# plugin changed since the last successful auto-bump.

on:
  push:
    branches:
      - 'main'

# Serialise runs so concurrent pushes don't race each other.
concurrency:
  group: auto-bump-main
  cancel-in-progress: false

jobs:
  auto-bump:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed plugins and bump CalVer
        id: bump
        run: |
          # Use the last version-manifest commit authored by this automation as
          # the baseline. This remains stable if a maintainer edits a squash
          # title, and it aggregates multiple main merges before the bump lands.
          BASE_SHA=$(git log --format=%H \
            --author='github-actions\[bot\]' \
            -n 1 -- \
            ':(glob)plugins/*/.claude-plugin/plugin.json' \
            ':(glob)plugins/*/.codex-plugin/plugin.json' \
            ':(glob)plugins/*/.cursor-plugin/plugin.json' \
            ':(glob)plugins/*/.grok-plugin/plugin.json' \
            ':(glob)plugins/*/plugin.json' \
            'gemini-extension.json' \
            '.devin-plugin/plugin.json')
          if [[ -z "$BASE_SHA" ]]; then
            BASE_SHA=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD -- \
            'plugins/' \
            'gemini-extension.json' \
            '.devin-plugin/' \
            'LICENSE' \
            'plugin.json' \
            'mcp_config.json' \
            'scripts/package_agent_plugin.py' \
            'skills')

          if [[ -z "$CHANGED" ]]; then
            echo "No plugin changes detected"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A plugin change must be nested under plugins/<name>/. Direct files
          # such as plugins/README.md are repository metadata, not plugins.
          PLUGIN_DIRS=$(echo "$CHANGED" | awk -F/ '$1 == "plugins" && NF >= 3 {print $1 "/" $2}' | sort -u)

          # Root compatibility surfaces and portable package inputs belong to
          # the signoz plugin, so their changes also bump signoz.
          if echo "$CHANGED" | grep -qE '^(gemini-extension\.json|\.devin-plugin/.*|LICENSE|plugin\.json|mcp_config\.json|scripts/package_agent_plugin\.py|skills)$'; then
            PLUGIN_DIRS=$(printf '%s\n%s\n' "$PLUGIN_DIRS" 'plugins/signoz' | sort -u)
          fi

          TODAY=$(date -u +%Y.%m.%d)
          COUNT=0

          set_json_version() {
            local MANIFEST="$1"
            local VERSION="$2"
            local TEMP_FILE="${MANIFEST}.tmp"
            if ! jq --arg version "$VERSION" '.version = $version' "$MANIFEST" > "$TEMP_FILE"; then
              rm -f "$TEMP_FILE"
              return 1
            fi
            mv "$TEMP_FILE" "$MANIFEST"
          }

          for PLUGIN_DIR in $PLUGIN_DIRS; do
            if [[ ! -d "$PLUGIN_DIR" ]]; then
              echo "Skipping removed plugin: $PLUGIN_DIR"
              continue
            fi

            PLUGIN_NAME=$(basename "$PLUGIN_DIR")

            # Use the same parity contract as pull-request validation before
            # calculating or writing the next version.
            python3 scripts/check_plugin_versions.py check "$PLUGIN_DIR"
            CURRENT=$(jq -r '.version' "$PLUGIN_DIR/.claude-plugin/plugin.json")

            # CalVer bump logic
            if [[ "$CURRENT" == "$TODAY" ]]; then
              NEW="${TODAY}.1"
            elif [[ "$CURRENT" == "${TODAY}."* ]]; then
              MICRO="${CURRENT##*.}"
              NEW="${TODAY}.$((MICRO + 1))"
            else
              NEW="$TODAY"
            fi

            # Monotonicity guard — never downgrade the version.
            # Use version-sort so numeric micro suffixes compare correctly
            # (e.g. 2026.04.08.10 > 2026.04.08.9).
            LOWEST=$(printf '%s\n%s\n' "$NEW" "$CURRENT" | sort -V | head -1)
            if [[ "$LOWEST" == "$NEW" && "$NEW" != "$CURRENT" ]]; then
              echo "WARNING: Computed version ($NEW) < current ($CURRENT) for $PLUGIN_DIR, keeping current"
              continue
            fi

            PORTABLE_JSON="$PLUGIN_DIR/plugin.json"
            SEMVER_VERSION=$(python3 scripts/check_plugin_versions.py encode "$NEW")

            for MANIFEST in \
              "$PLUGIN_DIR/.claude-plugin/plugin.json" \
              "$PLUGIN_DIR/.codex-plugin/plugin.json" \
              "$PLUGIN_DIR/.cursor-plugin/plugin.json" \
              "$PLUGIN_DIR/.grok-plugin/plugin.json"; do
              set_json_version "$MANIFEST" "$NEW"
            done

            set_json_version "$PORTABLE_JSON" "$SEMVER_VERSION"
            echo "Bumped $PORTABLE_JSON -> $SEMVER_VERSION"

            COUNT=$((COUNT + 1))
            echo "Bumped $PLUGIN_NAME: $CURRENT -> $NEW"

            # The root Gemini CLI extension manifest and Devin CLI plugin
            # manifest mirror the signoz plugin, so keep their versions in
            # lockstep with the same bump.
            if [[ "$PLUGIN_NAME" == "signoz" ]]; then
              set_json_version "gemini-extension.json" "$NEW"
              echo "Bumped gemini-extension.json -> $NEW (lockstep with signoz)"

              # Devin also enforces strict SemVer, so reuse the portable
              # manifest's monotonic SemVer encoding.
              set_json_version ".devin-plugin/plugin.json" "$SEMVER_VERSION"
              echo "Bumped .devin-plugin/plugin.json -> $SEMVER_VERSION (semver form of $NEW, lockstep with signoz)"
            fi
          done

          if (( COUNT == 0 )); then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "bumped=true"
              echo "count=$COUNT"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Commit, push branch, and open pull request
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP_BRANCH: automation/calver-version-bump
          BUMP_COUNT: ${{ steps.bump.outputs.count }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The branch is automation-owned and is regenerated from current main.
          git switch -C "$BUMP_BRANCH"
          git add plugins/**/.claude-plugin/plugin.json plugins/**/.codex-plugin/plugin.json plugins/**/.cursor-plugin/plugin.json plugins/**/.grok-plugin/plugin.json plugins/**/plugin.json gemini-extension.json .devin-plugin/plugin.json
          PR_TITLE="chore: auto-bump CalVer for $BUMP_COUNT plugin(s)"
          git commit -m "$PR_TITLE"
          git push --force-with-lease --set-upstream origin "$BUMP_BRANCH"

          PR_BODY=$'Automated CalVer update for plugin changes merged to `main`.\n\nThis PR updates every versioned manifest for the affected plugin(s).'

          # REST's owner:branch filter prevents a fork with the same branch
          # name from being mistaken for this repository's automation PR.
          PR_NUMBER=$(gh api \
            --method GET \
            "/repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open \
            -f base=main \
            -f head="${GITHUB_REPOSITORY%%/*}:$BUMP_BRANCH" \
            --jq '.[0].number // empty')

          if [[ -n "$PR_NUMBER" ]]; then
            gh pr edit "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
            echo "Updated existing version-bump PR #$PR_NUMBER"
          else
            if ! PR_URL=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BUMP_BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY" 2>&1); then
              echo "$PR_URL"
              echo "::error::Unable to create the version-bump PR. Verify that Settings > Actions > General > Allow GitHub Actions to create and approve pull requests is enabled."
              exit 1
            fi
            echo "Created version-bump PR: $PR_URL"
          fi
